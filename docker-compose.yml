services:
  postgres:
    image: postgres:16-alpine
    container_name: vahanloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vahanloop_db
      POSTGRES_USER: vahanloop_user
      POSTGRES_PASSWORD: vahanloop_password_dev
    ports:
      - "5432:5432"
    volumes:
      - vahanloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vahanloop_user -d vahanloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vahanloop_pgdata:
    driver: local
